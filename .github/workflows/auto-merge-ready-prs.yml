name: Validate and auto-merge pull requests
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head without executing PR workflows
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check for conflict markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!*.lock'; then exit 1; fi
      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, ast
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' not in p.parts:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
      - name: Run repository tests when configured
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -d tests ]; then
            python -m pip install pytest
            python -m pytest -q
          elif [ -f package.json ]; then
            echo 'Node tests require a dedicated repository workflow'; exit 1
          else
            echo 'No supported test configuration; manual gate required'; exit 1
          fi
  merge:
    needs: gate
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready and merge
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const number=context.issue.number;
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(pr.state!=='open'||pr.head.sha!==context.payload.pull_request.head.sha) return;
            if(pr.draft) {
              await github.graphql('mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){clientMutationId}}',{id:pr.node_id});
            }
            await github.rest.pulls.merge({owner,repo,pull_number:number,merge_method:'squash',sha:pr.head.sha});
