name: Auto-merge ready pull requests
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  check_suite:
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge on eligible PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumbers = [];
            if (context.payload.pull_request) {
              pullNumbers.push(context.payload.pull_request.number);
            } else {
              const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              pullNumbers.push(...prs.map(p => p.number));
            }
            for (const pull_number of pullNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.draft || pr.state !== 'open' || pr.head.repo?.full_name !== pr.base.repo.full_name) continue;
              try {
                await github.graphql(
                  `mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`,
                  { id: pr.node_id }
                );
                core.info(`Auto-merge enabled for #${pull_number}`);
              } catch (error) {
                core.warning(`Auto-merge #${pull_number}: ${error.message}`);
              }
            }
